# Monitoring thresholds.
#
# The PSI bands are the conventional ones from credit/fraud risk practice. They
# are heuristics, not properties of this dataset, and they live in config rather
# than in code so that tightening an alert does not require a code change.

drift:
  psi_stable_below: 0.10       # < 0.10  -> stable
  psi_moderate_below: 0.25     # 0.10-0.25 -> moderate shift; > 0.25 -> significant
  n_bins: 10
  # Rows sampled from each period. PSI is stable well below the full 472k rows.
  sample_rows: 60000
  # Measured baseline, train period vs the real test period 30 days later
  # (507 features, 60k rows each): 181 significant / 6 moderate / 320 stable.
  # A future run departing markedly from that mix is itself worth investigating.
  #
  # Caveat on magnitudes: PSI above ~10 comes from high-cardinality categoricals
  # where a level appears in one period and not the other, at which point the
  # epsilon floor dominates. Treat categorical PSI as a ranking, not a distance.

data_quality:
  # Absolute increase in missing rate that counts as an issue. Absolute rather
  # than relative because 0% -> 15% matters while 90% -> 92% does not.
  missing_rate_tolerance: 0.20
  # Fraction of values allowed outside the training range before flagging. Not
  # zero: a transaction larger than any seen in training is plausible, not a bug.
  out_of_range_tolerance: 0.01
  unseen_category_tolerance: 0.05

service:
  # Retained latency/score samples per metric key. Bounded memory, enough for
  # stable percentiles.
  reservoir_size: 2000
  # Minimum scored requests before prediction-drift is reported at all.
  min_scores_for_drift: 30
