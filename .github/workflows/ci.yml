name: CI

# push -> lint -> unit tests -> docker build -> API smoke test
#
# The dataset is not available in CI (1.3 GB, Kaggle competition rules), so the
# test suite runs entirely on schema-faithful synthetic fixtures — see
# tests/conftest.py. That is a deliberate design constraint: the tests exercise
# real code paths, including training a small LightGBM model and scoring it
# through the API, without needing the data.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install ruff
        run: pip install ruff==0.8.4

      - name: Ruff check
        run: ruff check src api database scripts tests

      - name: Ruff format check
        run: ruff format --check src api database scripts tests

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install system dependencies
        # libgomp1 is required by LightGBM's OpenMP threading.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgomp1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run pytest
        env:
          ENABLE_PREDICTION_LOG: "false"
          ENABLE_REDIS: "false"
        run: pytest -q --cov=src --cov=api --cov=database --cov-report=term-missing

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: .coverage
          if-no-files-found: ignore

  docker:
    name: Docker build + API smoke test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: fraud-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start container
        # No model artifact is mounted: CI has no trained model. The service is
        # designed to start anyway and report degraded health, which is exactly
        # what this smoke test asserts — a crash-loop here would be a real bug.
        run: |
          docker run -d --name fraud-api-ci -p 8000:8000 \
            -e ENABLE_PREDICTION_LOG=false \
            -e ENABLE_REDIS=false \
            fraud-api:ci

      - name: Wait for the service to respond
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health > /dev/null 2>&1; then
              echo "Service responded after ${attempt} attempt(s)"
              exit 0
            fi
            sleep 2
          done
          echo "Service did not become ready"
          docker logs fraud-api-ci
          exit 1

      - name: Smoke test endpoints
        run: |
          set -euo pipefail

          echo "--- GET /health ---"
          health=$(curl -fsS http://localhost:8000/health)
          echo "$health"
          echo "$health" | grep -q '"status"' || { echo "no status field"; exit 1; }

          echo "--- GET / ---"
          curl -fsS http://localhost:8000/ | grep -q '"docs"'

          echo "--- GET /docs ---"
          curl -fsS -o /dev/null -w '%{http_code}\n' http://localhost:8000/docs | grep -q 200

          echo "--- GET /openapi.json (all endpoints registered) ---"
          spec=$(curl -fsS http://localhost:8000/openapi.json)
          for route in "/predict" "/predict/batch" "/explain" "/model-info" "/monitoring/metrics"; do
            echo "$spec" | grep -q "\"$route\"" || { echo "missing route $route"; exit 1; }
          done

          echo "--- POST /predict without a model must be 503, not 500 ---"
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8000/predict \
            -H 'Content-Type: application/json' \
            -d '{"transaction_amt": 100.0, "product_cd": "W"}')
          echo "status=$code"
          [ "$code" = "503" ] || { echo "expected 503, got $code"; docker logs fraud-api-ci; exit 1; }

          echo "--- POST /predict with an invalid body must be 422 ---"
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8000/predict \
            -H 'Content-Type: application/json' \
            -d '{"transaction_amt": -5.0}')
          echo "status=$code"
          [ "$code" = "422" ] || { echo "expected 422, got $code"; exit 1; }

          echo "All smoke tests passed"

      - name: Container logs
        if: always()
        run: docker logs fraud-api-ci || true

      - name: Stop container
        if: always()
        run: docker rm -f fraud-api-ci || true

  compose-validate:
    name: Validate docker-compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate compose file
        run: docker compose -f docker-compose.yml config --quiet
