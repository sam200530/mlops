name: CI

# push -> lint -> unit tests -> docker build -> API smoke test
#
# The dataset is not available in CI (1.3 GB, Kaggle competition rules), so the
# test suite runs entirely on schema-faithful synthetic fixtures — see
# tests/conftest.py. That is a deliberate constraint: the tests exercise real
# code paths, including training a small LightGBM model and scoring it through
# the API, without needing the data.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install ruff
        # Version is read from requirements-dev.txt so local and CI can never
        # drift. A hardcoded pin here previously disagreed with the locally
        # installed version and failed the build on formatting differences.
        run: pip install "$(grep '^ruff==' requirements-dev.txt)"

      - name: Ruff check
        run: ruff check src api scripts tests

      - name: Ruff format check
        run: ruff format --check src api scripts tests

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install system dependencies
        # libgomp1 is required by LightGBM's OpenMP threading.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgomp1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run pytest
        run: pytest -q --cov=src --cov=api --cov-report=term-missing

  docker:
    name: Docker build + API smoke test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: fraud-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start container
        # No model artifact is mounted: CI has no trained model. The service is
        # designed to start anyway and report degraded health, which is what this
        # smoke test asserts — a crash-loop here would be a real bug.
        run: docker run -d --name fraud-api-ci -p 8000:8000 fraud-api:ci

      - name: Wait for the service to respond
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health > /dev/null 2>&1; then
              echo "Service responded after ${attempt} attempt(s)"
              exit 0
            fi
            sleep 2
          done
          echo "Service did not become ready"
          docker logs fraud-api-ci
          exit 1

      - name: Smoke test endpoints
        run: |
          set -euo pipefail

          echo "--- GET /health (must report degraded without a model) ---"
          health=$(curl -fsS http://localhost:8000/health)
          echo "$health"
          echo "$health" | grep -q '"status":"degraded"'
          echo "$health" | grep -q '"model_loaded":false'

          echo "--- GET /docs ---"
          curl -fsS -o /dev/null -w '%{http_code}\n' http://localhost:8000/docs | grep -q 200

          echo "--- all three routes registered in the OpenAPI spec ---"
          spec=$(curl -fsS http://localhost:8000/openapi.json)
          for route in "/health" "/predict" "/explain"; do
            echo "$spec" | grep -q "\"$route\"" || { echo "missing route $route"; exit 1; }
          done

          echo "--- POST /predict without a model must be 503, not 500 ---"
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8000/predict \
            -H 'Content-Type: application/json' \
            -d '{"transaction_amt": 100.0, "product_cd": "W"}')
          [ "$code" = "503" ] || { echo "expected 503, got $code"; docker logs fraud-api-ci; exit 1; }

          echo "--- POST /predict with an invalid body is also 503 without a model ---"
          # FastAPI resolves dependencies before validating the request body, so
          # require_artifact's 503 short-circuits ahead of the 422. With no model
          # mounted every /predict call is 503 regardless of payload. The 422
          # validation path is covered by tests/test_api.py, which runs with a
          # model loaded and asserts 422 across 8 parametrised invalid payloads.
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8000/predict -H 'Content-Type: application/json' -d '{"transaction_amt": -5.0}')
          [ "$code" = "503" ] || { echo "expected 503, got $code"; docker logs fraud-api-ci; exit 1; }

          echo "All smoke tests passed"

      - name: Container logs
        if: always()
        run: docker logs fraud-api-ci || true

      - name: Stop container
        if: always()
        run: docker rm -f fraud-api-ci || true
